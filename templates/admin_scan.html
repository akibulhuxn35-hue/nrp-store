{% extends "base.html" %}
{% block title %}Scan QR — NRP Store{% endblock %}
{% block content %}
<section class="section admin-scan-page">
    <span class="eyebrow">NRP STORE ADMIN</span>
    <h1 class="page-title">Scan QR<span class="gold-dot">.</span></h1>

    <div class="scan-panel">
        <p>Customer ke Order QR code ko camera ke saamne rakhein.</p>
        <div id="reader"></div>
        <button type="button" class="btn btn-gold" id="start-scan">📷 Start Camera</button>
        <button type="button" class="btn btn-outline" id="stop-scan">Stop Camera</button>
        <p id="scan-message" role="status"></p>
    </div>

    <div class="scan-panel">
        <label for="manual-token">Manual QR token</label>
        <input id="manual-token" type="text" placeholder="Paste QR token here">
        <button type="button" class="btn btn-gold" id="lookup-token">Find Order</button>
    </div>

    <div class="scan-panel">
        <label for="manual-order-id">Search by Order ID</label>
        <input id="manual-order-id" type="number" min="1" placeholder="Enter Order ID">
        <button type="button" class="btn btn-gold" id="lookup-order-id">Search Order ID</button>
    </div>

    <div id="order-result" class="scan-result" hidden>
        <h2>Order Details</h2>
        <div id="order-info"></div>
        <h3>Products</h3>
        <div id="order-items"></div>

        <form id="status-form">
            <label for="new-status">Update order status</label>
            <select id="new-status" name="status">
                <option>Confirmed</option>
                <option>Packed</option>
                <option>Shipped</option>
                <option>Out for Delivery</option>
            </select>
            <button class="btn btn-gold" type="submit">Update Status</button>
        </form>

        <button type="button" class="btn btn-gold full" id="confirm-delivery" hidden>
            🚚 Confirm Delivery
        </button>
    </div>
</section>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
let scanner = null;
let currentOrderId = null;
let currentToken = "";
let busy = false;

const message = document.getElementById("scan-message");
const result = document.getElementById("order-result");
const confirmButton = document.getElementById("confirm-delivery");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
    })[char]);
}

async function findOrder(token, orderId = null) {
    if ((!token && !orderId) || busy) return;

    busy = true;
    currentToken = "";
    confirmButton.hidden = true;
    result.hidden = true;
    message.textContent = "Searching order...";

    try {
        const response = await fetch("{{ url_for('admin_scan_order') }}", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(orderId ? {order_id: orderId} : {token})
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Order not found.");

        const o = data.order;
        currentOrderId = o.id;
        currentToken = token || "";

        document.getElementById("order-info").innerHTML = `
            <p><b>Order:</b> #${escapeHTML(o.id)}</p>
            <p><b>Customer:</b> ${escapeHTML(o.customer_name)}</p>
            <p><b>Phone:</b> ${escapeHTML(o.phone)}</p>
            <p><b>Email:</b> ${escapeHTML(o.email || "")}</p>
            <p><b>Address:</b> ${escapeHTML(o.address)}</p>
            <p><b>Total:</b> ₹${Number(o.total).toFixed(2)}</p>
            <p><b>Status:</b> ${escapeHTML(o.status)}</p>
            <p><b>Date:</b> ${escapeHTML(o.created_at || "")}</p>
        `;

        document.getElementById("order-items").innerHTML =
            data.items.map(item => `
                <p>${escapeHTML(item.product_name)} — ₹${Number(item.price).toFixed(2)}
                × ${Number(item.quantity)}</p>
            `).join("");

        document.getElementById("new-status").value =
            ["Confirmed", "Packed", "Shipped", "Out for Delivery"].includes(o.status)
            ? o.status : "Confirmed";

        document.getElementById("status-form").hidden =
            ["Delivered", "Cancelled"].includes(o.status);

        confirmButton.hidden = !(o.status === "Out for Delivery" && currentToken);
        result.hidden = false;

        message.textContent = o.status === "Out for Delivery" && !currentToken
            ? "Delivery confirm karne ke liye customer ka QR scan karein."
            : "Order found successfully.";
    } catch (error) {
        currentOrderId = null;
        currentToken = "";
        message.textContent = error.message;
    } finally {
        busy = false;
    }
}

document.getElementById("start-scan").addEventListener("click", async () => {
    if (typeof Html5Qrcode === "undefined") {
        message.textContent = "Scanner library load nahi hui. Internet check karein.";
        return;
    }
    try {
        if (!scanner) scanner = new Html5Qrcode("reader");
        await scanner.start(
            {facingMode: "environment"},
            {fps: 10, qrbox: {width: 220, height: 220}},
            async decodedText => {
                await scanner.stop();
                await findOrder(decodedText);
            },
            () => {}
        );
        message.textContent = "Camera scanning started.";
    } catch (error) {
        message.textContent = "Camera start nahi hua. Camera permission aur HTTPS check karein.";
    }
});

document.getElementById("stop-scan").addEventListener("click", async () => {
    if (scanner && scanner.isScanning) {
        await scanner.stop();
        message.textContent = "Camera stopped.";
    }
});

document.getElementById("lookup-token").addEventListener("click", () => {
    findOrder(document.getElementById("manual-token").value.trim());
});

document.getElementById("lookup-order-id").addEventListener("click", () => {
    const orderId = document.getElementById("manual-order-id").value.trim();
    findOrder("", orderId);
});

document.getElementById("status-form").addEventListener("submit", async event => {
    event.preventDefault();
    if (!currentOrderId || busy) return;

    busy = true;
    const body = new URLSearchParams({
        status: document.getElementById("new-status").value
    });

    try {
        const response = await fetch(`/admin/order/${currentOrderId}`, {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: body.toString()
        });
        if (!response.ok) throw new Error("Status update failed.");
        message.textContent = "Status update request complete. Order dobara search karke verify karein.";
    } catch (error) {
        message.textContent = error.message;
    } finally {
        busy = false;
    }
});

confirmButton.addEventListener("click", async () => {
    if (!currentToken || busy) return;
    if (!confirm("Kya aap is customer ki delivery confirm karna chahte hain?")) return;

    busy = true;
    message.textContent = "Confirming delivery...";
    try {
        const response = await fetch("{{ url_for('admin_confirm_delivery') }}", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({token: currentToken})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Delivery confirmation failed.");

        message.textContent = "✅ Order #" + data.order_id + " delivery confirmed successfully!";
        currentToken = "";
        confirmButton.hidden = true;
        document.querySelector("#order-info").innerHTML =
            document.querySelector("#order-info").innerHTML.replace(
                /<p><b>Status:<\/b>.*?<\/p>/,
                "<p><b>Status:</b> Delivered</p>"
            );
        document.getElementById("status-form").hidden = true;
    } catch (error) {
        message.textContent = error.message;
    } finally {
        busy = false;
    }
});
</script>
{% endblock %}
