{% extends "base.html" %}{% block title %}My orders — NRP Store{% endblock %}{% block content %}<section class="section"><span class="eyebrow">YOUR PURCHASES</span><h1 class="page-title">My orders<span class="gold-dot">.</span></h1>{% for o in orders %}<div class="order-card"><div><b>Order #{{ o.id }}</b><small>{{ o.created_at }}</small></div><div><b>₹{{ '%.2f'|format(o.total) }}</b><small class="status">{{ o.status }}</small></div></div>{% else %}<div class="empty-state"><h2>No orders yet.</h2><a class="btn btn-gold" href="{{ url_for('index') }}">Start shopping</a></div>{% endfor %}</section>{% endblock %}
