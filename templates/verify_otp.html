{% extends "base.html" %}
{% block title %}Verify OTP — NRP STORE{% endblock %}
{% block content %}
<div class="auth-page">
 <div class="auth-box">
  <div class="auth-logo">NRP <span>STORE</span></div>
  <h1>Verify OTP</h1>
  <p class="auth-sub">Enter your registered email and the 6-digit OTP sent to your inbox.</p>
  <form method="post">
   <label>Email address</label>
   <input type="email" name="email" placeholder="Registered email" required>
   <label>6-digit OTP</label>
   <input type="text" name="otp" placeholder="Enter OTP" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
   <button class="auth-submit" type="submit">VERIFY OTP →</button>
  </form>
  <div class="auth-switch"><a href="{{ url_for('forgot_password') }}">Request a new OTP</a></div>
 </div>
</div>
<style>
.auth-page{min-height:65vh;display:flex;align-items:center;justify-content:center;padding:25px 15px;background:#f5f7fa}
.auth-box{width:100%;max-width:430px;background:white;padding:30px 25px;border-radius:18px;box-shadow:0 8px 35px #10213a12}
.auth-logo{text-align:center;font-size:25px;font-weight:900;color:#102c52;margin-bottom:25px}
.auth-logo span{color:#16a36a}
.auth-box h1{font-size:25px;color:#172b4d}
.auth-sub{color:#718096;font-size:14px;line-height:1.6}
.auth-box label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}
.auth-box input{width:100%;padding:14px;border:1px solid #dce2eb;border-radius:9px;font-size:15px}
.auth-submit{width:100%;border:0;border-radius:9px;padding:15px;background:#1769aa;color:white;font-size:16px;font-weight:800;margin-top:22px}
.auth-switch{text-align:center;margin-top:22px}
.auth-switch a{color:#1769aa;font-weight:700;text-decoration:none}
</style>
{% endblock %}
